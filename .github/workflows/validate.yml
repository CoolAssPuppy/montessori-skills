name: validate

on:
  push:
  pull_request:

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validators
        run: |
          python -m pip install --upgrade pip
          python -m pip install jsonschema PyYAML skills-ref
      - name: Generate-copy drift check
        run: python scripts/generate_local_refs.py --check
      - name: Static package validation
        run: python scripts/validate.py
      - name: Fixture tests
        run: python -m unittest discover -s tests -v
      - name: Record tool versions
        run: |
          python -c "import jsonschema, yaml, skills_ref, importlib.metadata as m; print('jsonschema', m.version('jsonschema')); print('PyYAML', m.version('PyYAML')); print('skills-ref', m.version('skills-ref'))"
          agentskills --version || true
          claude --version || echo "claude CLI not installed in this CI image"
